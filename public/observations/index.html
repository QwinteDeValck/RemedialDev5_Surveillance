<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Observations — Neighborhood Surveillance</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">Neighborhood Surveillance</a>
    <div class="navbar-links" id="navLinks"></div>
  </nav>

  <div class="container">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem">
      <h2>My Observations</h2>
      <a href="/observations/new.html" class="btn btn-cta">+ New Observation</a>
    </div>

    <div id="feedback" class="feedback"></div>

    <div id="loading" style="text-align:center;padding:3rem;color:#666">Loading...</div>

    <table id="observationsTable" style="width:100%;border-collapse:collapse;display:none">
      <thead>
        <tr style="background:#1E1E1E;color:#fff;text-align:left">
          <th style="padding:0.75rem">Title</th>
          <th style="padding:0.75rem">Category</th>
          <th style="padding:0.75rem">Visibility</th>
          <th style="padding:0.75rem">Status</th>
          <th style="padding:0.75rem">Date</th>
          <th style="padding:0.75rem">Actions</th>
        </tr>
      </thead>
      <tbody id="observationsBody"></tbody>
    </table>

    <div id="emptyState" style="text-align:center;padding:3rem;color:#666;display:none">
      <p>No observations yet.</p>
      <a href="/observations/new.html" class="btn btn-cta" style="margin-top:1rem">Create your first observation</a>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/observations-list.js"></script>
</body>
</html>
