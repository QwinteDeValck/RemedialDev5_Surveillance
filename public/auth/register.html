<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register — Neighborhood Surveillance</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/form.css">
</head>
<body>
  <nav class="navbar">
    <a href="/" class="navbar-brand">Neighborhood Surveillance</a>
    <div class="navbar-links" id="navLinks">
      <a href="/">Home</a>
      <a href="/auth/register.html">Register</a>
      <a href="/auth/login.html">Login</a>
    </div>
  </nav>

  <div class="form-page">
    <div class="form-card">
      <h2>Create an Account</h2>

      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" required minlength="3">
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required minlength="6">
      </div>

      <button class="btn btn-cta btn-full" onclick="register()">Register</button>

      <div id="feedback" class="feedback"></div>

      <div class="form-footer">
        Already have an account? <a href="/auth/login.html">Log in</a>
      </div>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
